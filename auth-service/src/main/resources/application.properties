spring.application.name=auth

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/authdb?schema=auth
spring.r2dbc.username=postgres
spring.r2dbc.password=


server.port=8080

spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql


grpc.client.account.address=static://localhost:9091
grpc.client.account.negotiationType=PLAINTEXT

grpc.client.customer.address=static://localhost:9092
grpc.client.customer.negotiationType=PLAINTEXT


# Redis (OTP store)
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.otp.length=4
app.otp.ttl-seconds=300

# Kafka
spring.kafka.producer.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.topic.otp-requested=otp-requested
app.kafka.topic.user-registered=user-registered

app.outbox.poll-interval-ms=2000

#JWT
app.jwt.secret=change-this-to-a-long-random-32byte-plus-secret-per-environment
app.jwt.expiration-seconds=3600

app.authz.service-url=http://localhost:8081/graphql

